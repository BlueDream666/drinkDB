<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>饮库自测</title></head>
<body style="font-family:system-ui;padding:20px">
<pre id="out">跑着呢…</pre>
<iframe id="f" src="index.html" style="width:1200px;height:760px;border:1px solid #ccc"></iframe>
<iframe id="fa" src="admin.html" style="display:none"></iframe>
<script>
var log = [], pass = 0, fail = 0;
function ok(name, cond, extra) {
  cond ? pass++ : fail++;
  log.push((cond ? '✓ ' : '✗ ') + name + (extra !== undefined ? '   → ' + extra : ''));
}
function txt(d, id) { var e = d.getElementById(id); return e ? e.textContent.trim() : '(无 #' + id + ')'; }
function cnt(s) { var m = String(s).match(/(\d+)/); return m ? (+m[1]) : null; }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

document.getElementById('f').addEventListener('load', async function () {
  var w = this.contentWindow, d = this.contentDocument;
  try {
    /* ============ A. 默认状态 ============ */
    ok('默认显示全部 203 款', txt(d, 'count').indexOf('203') >= 0, txt(d, 'count'));
    ok('默认是两排模式', d.getElementById('flowZone').style.display !== 'none' &&
                        d.getElementById('gridZone').style.display === 'none');
    ok('两排都有卡片', d.querySelectorAll('#flowA .card').length > 0 && d.querySelectorAll('#flowB .card').length > 0,
       'A=' + d.querySelectorAll('#flowA .card').length + ' B=' + d.querySelectorAll('#flowB .card').length);

    /* ============ B. 两排是「手动横滑」，不再自动平移 ============ */
    await wait(300);
    var rowA = d.getElementById('flowA'), rowB = d.getElementById('flowB');
    ok('两排内容都比容器宽（可横向滚动）',
       rowA.scrollWidth > rowA.clientWidth + 100 && rowB.scrollWidth > rowB.clientWidth + 100,
       'A ' + rowA.scrollWidth + '>' + rowA.clientWidth + '  B ' + rowB.scrollWidth + '>' + rowB.clientWidth);
    ok('两排都不带 transform（没有自动平移）',
       w.getComputedStyle(d.querySelector('#flowA .flowtrack')).transform === 'none',
       w.getComputedStyle(d.querySelector('#flowA .flowtrack')).transform);
    ok('没有 CSS 动画', w.getComputedStyle(d.querySelector('#flowA .flowtrack')).animationName === 'none');

    var s0 = w.__drinkdb.scrollOf();
    ok('初始滚动位置都在 0', s0[0] === 0 && s0[1] === 0, JSON.stringify(s0));
    rowA.scrollLeft = 300;
    await wait(400);
    var pA = rowA.scrollLeft;
    ok('上排能手动滑动', pA > 100, 'scrollLeft=' + pA);
    await wait(700);
    ok('滑完停在原地，不会自己跑', rowA.scrollLeft === pA, pA + ' → ' + rowA.scrollLeft);

    rowB.scrollLeft = 220;
    await wait(400);
    var pB = rowB.scrollLeft;
    ok('下排能独立滑动', pB > 100 && pB !== pA, 'A=' + rowA.scrollLeft + ' B=' + pB);
    await wait(700);
    ok('下排也停住不动', rowB.scrollLeft === pB && rowA.scrollLeft === pA,
       'A=' + rowA.scrollLeft + ' B=' + rowB.scrollLeft);

    /* ============ C. 重新渲染后滚动位置不丢 ============ */
    d.getElementById('filterToggle').click();          // 打开筛选面板
    d.querySelector('.chip[data-k="cf"][data-i="0"]').click();   // 加一个条件 → 变网格
    d.getElementById('qClear').click();                // 清掉 → 回到两排
    await wait(300);
    var s1 = w.__drinkdb.scrollOf();
    ok('切回两排后滚动位置还在', s1[0] === pA && s1[1] === pB,
       JSON.stringify(s1) + '，应为 [' + pA + ',' + pB + ']');
    rowA.scrollLeft = 0; rowB.scrollLeft = 0;

    /* ============ D. 三态筛选 ============ */
    var panel = d.getElementById('filterPanel');
    if (!panel.classList.contains('open')) d.getElementById('filterToggle').click();
    d.getElementById('qClear').click();

    var cOK = d.querySelector('.chip[data-k="carb"][data-i="0"]');   // 没气
    cOK.click();
    ok('点一下 = 要', cOK.getAttribute('data-st') === '1', 'data-st=' + cOK.getAttribute('data-st'));
    ok('要了之后切成网格', d.getElementById('gridZone').style.display !== 'none');
    var want = cnt(txt(d, 'count'));
    ok('“没气”筛出来是对的', want > 0 && want < 203, txt(d, 'count'));

    cOK.click();
    ok('点两下 = 不要', cOK.getAttribute('data-st') === '2', 'data-st=' + cOK.getAttribute('data-st'));
    var no = cnt(txt(d, 'count'));
    ok('“不要没气”正好是剩下那些', no > 0 && want + no === 203, want + ' + ' + no + ' = ' + (want + no));

    cOK.click();
    ok('点三下 = 取消', cOK.getAttribute('data-st') === '0', 'data-st=' + cOK.getAttribute('data-st'));
    ok('取消后回到全部', cnt(txt(d, 'count')) === 203, txt(d, 'count'));

    // 要 + 不要 混着用
    d.querySelector('.chip[data-k="carb"][data-i="1"]').click();   // 要：有气
    cOK.click(); cOK.click();                                      // 不要：没气
    var mixed = cnt(txt(d, 'count'));
    var expect = w.Store.all().filter(function (b) { return b.cb > 0; }).length;
    ok('“要有气”+“不要没气”结果自洽', mixed === expect, mixed + ' / 应为 ' + expect);
    d.getElementById('qClear').click();

    /* ============ E. 跨行 = 且 ============ */
    d.querySelector('.chip[data-k="carb"][data-i="0"]').click();
    var s1 = cnt(txt(d, 'count'));
    d.querySelector('.chip[data-k="sugar"][data-i="0"]').click();
    var s2 = cnt(txt(d, 'count'));
    ok('再加一行条件只会更少', s2 < s1 && s2 > 0, s1 + ' → ' + s2);

    // 同一行多选 = 或
    var s3before = s2;
    d.querySelector('.chip[data-k="sugar"][data-i="3"]').click();  // 糖挺多（与“一点糖都没有”互斥）
    var s3 = cnt(txt(d, 'count'));
    ok('同行多选是「或」', s3 > s3before, s3before + ' → ' + s3);
    d.getElementById('qClear').click();

    /* ============ F. 摘要 ============ */
    d.querySelector('.chip[data-k="tea"][data-i="0"]').click();
    ok('摘要里出现已选条件', d.querySelectorAll('#summary .sm').length === 1,
       d.querySelectorAll('#summary .sm').length + ' 个');
    d.querySelector('#summary .sm').click();
    ok('点摘要能去掉它', d.querySelectorAll('#summary .sm').length === 0);
    d.getElementById('qClear').click();

    /* ============ G. 快捷 ============ */
    d.getElementById('qOk').click();
    var q1 = cnt(txt(d, 'count'));
    ok('快捷「糖少、没气」', q1 > 0 && q1 < 100, txt(d, 'count'));
    ok('快捷后不是两排', d.getElementById('flowZone').style.display === 'none');
    d.getElementById('qClear').click();
    ok('清空后回到两排', d.getElementById('flowZone').style.display !== 'none');

    /* ============ H. 搜索 / 排序 ============ */
    var sb = d.getElementById('search');
    sb.value = '可乐';
    sb.dispatchEvent(new w.Event('input', { bubbles: true }));
    var kw = cnt(txt(d, 'count'));
    ok('搜「可乐」', kw > 0 && kw < 40, txt(d, 'count'));
    d.getElementById('qClear').click();
    var so = d.getElementById('sort');
    ok('排序项够多', so.options.length >= 12, so.options.length + ' 项');
    so.value = 'sugar-desc';
    so.dispatchEvent(new w.Event('change', { bubbles: true }));
    var first = d.querySelector('#gridZone .card .nm');
    ok('糖分降序，第一张是糖最多的', first && /利口酒|养乐多|维他|星冰乐|安慕希|营养快线/.test(first.textContent),
       first ? first.textContent : '(空)');
    d.getElementById('qClear').click();

    /* ============ I. 详情 ============ */
    d.querySelector('#flowA .card[data-id="coke-classic"]').click();
    var modal = d.getElementById('detail');
    ok('点卡片能打开详情', modal.classList.contains('on'));
    var body = modal.textContent;
    ok('详情里有「开盖一夜」', /开盖一夜/.test(body));
    ok('详情里有「衰减幅度」', /衰减幅度/.test(body));
    ok('详情字段 ≥ 14 个', modal.querySelectorAll('dt').length >= 14, modal.querySelectorAll('dt').length + ' 个');
    modal.querySelector('[data-close]').click();
    ok('能关掉详情', !modal.classList.contains('on'));

    /* ============ J. 提交 → 放行 → 入库 ============ */
    var p0 = w.Store.stats().pending;
    w.Store.submit({ n: '自测用的柚子茶', b: '自测牌子', c: '无糖茶', sg: '0', s: '0', sw: '2', cb: '0', fd: '0', by: '脚本' });
    ok('提交进了待审队列', w.Store.stats().pending === p0 + 1, 'pending=' + w.Store.stats().pending);
    var before = w.Store.all().length;
    var rec = w.Store.pending().filter(function (x) { return x.n === '自测用的柚子茶'; })[0];
    w.Store.approve(rec.id);
    ok('放行后进库', w.Store.all().length === before + 1, before + ' → ' + w.Store.all().length);
    var added = w.Store.all().filter(function (x) { return x.n === '自测用的柚子茶'; })[0];
    ok('网友条目结构完整', added && added.c === '无糖茶' && added.hasCarb === false && !!added.brief, added ? added.brief : '(空)');
    ok('网友条目带来源标记', added && added.fromUser === true);
    w.Store.restore({ pending: [], approved: [], rejected: [] });

    /* ============ K. 导出 ============ */
    ok('导出模块在', !!(w.Exporter && w.Exporter.toExcel && w.Exporter.toCSV));
    ok('导出列数 ≥ 25', w.Exporter.columns.length >= 25, w.Exporter.columns.length + ' 列');

    /* ============ L. 自适应 ============ */
    ok('网格是自适应列宽（手机上不会横向溢出）',
       w.getComputedStyle(d.querySelector('.grid')).gridTemplateColumns.split(' ').length >= 2);

    /* ============ M. 审核台口令（只验证「错的进不去」，不验证正确口令）============
       正确口令是私密的，绝不会出现在这个文件里。
       想验证自己的口令能不能进，就在浏览器打开 admin.html 手动试一次。 */
    var fa = document.getElementById('fa');
    await new Promise(function (r) {
      // admin.html 早就并行加载好了，所以先看 readyState，别傻等 load 事件
      if (fa.contentWindow && fa.contentWindow.Store) return r();
      fa.addEventListener('load', r);
    });
    var aw = fa.contentWindow, ad = fa.contentDocument;

    ok('审核台载入了 sha256 模块', typeof aw.sha256Hex === 'function');
    ok('配置里没有明文口令字段',
       aw.DRINKDB_CONFIG.adminPasscode === undefined,
       'adminPasscode=' + aw.DRINKDB_CONFIG.adminPasscode);
    ok('配置里存的是盐 + 64 位摘要',
       typeof aw.DRINKDB_CONFIG.adminSalt === 'string' && aw.DRINKDB_CONFIG.adminSalt.length === 32
       && /^[0-9a-f]{64}$/.test(aw.DRINKDB_CONFIG.adminHash),
       'salt ' + aw.DRINKDB_CONFIG.adminSalt.length + ' 位，hash ' + aw.DRINKDB_CONFIG.adminHash.length + ' 位');
    ok('sha256 对已知输入正确',
       aw.sha256Hex('abc') === 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad');

    ok('空口令被拒', aw.Store.login('') === false);
    ok('瞎猜的口令被拒', aw.Store.login('123456') === false);
    ok('错口令被拒', aw.Store.login('definitely-not-the-password') === false);
    ok('失败次数在累计', aw.Store.failCount() >= 3, '已错 ' + aw.Store.failCount() + ' 次');
    ok('错口令不会给会话', aw.Store.isAdmin() === false);
    aw.Store.restore({ pending: [], approved: [], rejected: [] });

  } catch (e) {
    fail++; log.push('✗ 抛异常：' + e.message + '\n   ' + (e.stack || '').split('\n')[1]);
  }
  document.getElementById('out').textContent =
    'SELFTEST 通过 ' + pass + ' / 失败 ' + fail + '\n\n' + log.join('\n');
});
</script>
</body></html>
