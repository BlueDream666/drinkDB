name: 部署到 GitHub Pages

# 推到 main 就自动发布。也可以在 Actions 页面手动点 Run workflow。
#
# 说明：这里用最朴素的写法——把整个仓库原样上传。
# 不要学网上那种「只 cp 某几个文件到 _site」的写法：一旦加了新目录
# （比如 img/、worker/）就会漏掉，页面直接白屏。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
