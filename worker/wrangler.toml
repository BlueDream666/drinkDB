# 饮库 DrinkDB —— Worker 配置
#
# 这是给 wrangler 命令行用的。如果你照 README 走「网页版」流程，
# 这份文件用不上，忽略它也行。

name = "drinkdb-api"
main = "index.js"
compatibility_date = "2024-11-01"

# 允许哪些网站来调这个接口。
# 换成你自己的地址，比 "*" 安全；本地调试可以先用 "*"。
[vars]
ALLOWED_ORIGIN = "*"

# D1 数据库。创建后把 database_id 填到这里。
# 命令行：wrangler d1 create drinkdb
[[d1_databases]]
binding = "DB"
database_name = "drinkdb"
database_id = "把 Cloudflare 给你的那一串 id 填这里"

# 可选：频率限制用的 KV。不配也能跑，只是少一层防刷。
# 命令行：wrangler kv namespace create RATE
# [[kv_namespaces]]
# binding = "RATE"
# id = "把 KV 的 id 填这里"

# 管理口令不要写在这个文件里（会被提交到仓库），用命令行设置：
#   wrangler secret put ADMIN_TOKEN
