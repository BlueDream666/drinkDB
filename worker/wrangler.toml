# 饮库 DrinkDB —— Worker 配置
#
# 这个文件是给 wrangler 命令行用的。
# 跑 tools/deploy-worker.ps1 时会读它，所以数据库 ID 已经填好了。

name = "drinkdb"
main = "index.js"
compatibility_date = "2025-01-01"

# 允许哪些网站来调这个接口。
# "*" 表示不限制。想收紧就换成你自己的地址，例如：
#   ALLOWED_ORIGIN = "https://bluedream666.github.io"
[vars]
ALLOWED_ORIGIN = "*"

[[d1_databases]]
binding = "DB"
database_name = "drinkdb"
database_id = "f65256ef-eb39-49a6-aeaa-5745541adc86"

# 管理口令不写在这里（会被提交到仓库），用命令设置：
#   npx wrangler secret put ADMIN_TOKEN
